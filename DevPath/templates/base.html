<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}DevPath{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>

      /* ══════════════════════════════════
         CSS VARIABLES
      ══════════════════════════════════ */
      :root {
        --bg-deep:      #0d1117;
        --bg-card:      #161b27;
        --bg-raised:    #1e2537;
        --border:       #2a3350;
        --purple-400:   #a78bfa;
        --purple-500:   #8b5cf6;
        --purple-600:   #7c3aed;
        --purple-glow:  rgba(139,92,246,0.35);
        --gold:         #f59e0b;
        --success:      #10b981;
        --danger:       #ef4444;
        --muted:        #6b7a99;
        --text:         #e2e8f0;
        --text-dim:     #94a3b8;
        --radius:       14px;
        --radius-sm:    8px;
      }

      /* ══════════════════════════════════
         RESET & BASE
      ══════════════════════════════════ */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg-deep);
        color: var(--text);
        font-family: 'Space Grotesk', sans-serif;
        min-height: 100vh;
        line-height: 1.5;
        background-image:
          radial-gradient(ellipse 80% 50% at 50% -10%, rgba(139,92,246,0.13) 0%, transparent 60%),
          radial-gradient(ellipse 40% 30% at 90% 85%, rgba(99,102,241,0.07) 0%, transparent 50%);
      }

      a { color: inherit; text-decoration: none; }

      /* ══════════════════════════════════
         TOP NAV
      ══════════════════════════════════ */
      .site-nav {
        position: sticky;
        top: 0;
        z-index: 200;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1.5rem;
        background: rgba(13,17,23,0.88);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-bottom: 1px solid var(--border);
      }

      .nav-brand {
        display: flex;
        align-items: center;
        gap: 9px;
        text-decoration: none;
      }

      .nav-brand-badge {
        background: var(--purple-600);
        color: #fff;
        font-family: 'JetBrains Mono', monospace;
        font-size: .72rem;
        font-weight: 700;
        padding: 3px 9px;
        border-radius: 6px;
        letter-spacing: .02em;
      }

      .nav-brand-name {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 1.05rem;
        color: var(--purple-400);
        letter-spacing: -.01em;
      }

      .nav-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* ══════════════════════════════════
         STATS BAR (logged-in only)
      ══════════════════════════════════ */
      .stats-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 1.5rem;
        background: rgba(22,27,39,0.7);
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
        scrollbar-width: none;
      }

      .stats-bar::-webkit-scrollbar { display: none; }

      .stat-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--bg-raised);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 5px 14px;
        font-size: .82rem;
        font-weight: 700;
        color: var(--text);
        white-space: nowrap;
        flex-shrink: 0;
      }

      /* ══════════════════════════════════
         BUTTONS
      ══════════════════════════════════ */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: none;
        cursor: pointer;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 600;
        font-size: .85rem;
        border-radius: var(--radius-sm);
        padding: 8px 18px;
        transition: background .2s, transform .15s, box-shadow .2s, color .2s, border-color .2s;
        text-decoration: none;
        white-space: nowrap;
        line-height: 1;
      }

      .btn:active { transform: scale(.97); }

      .btn-primary {
        background: var(--purple-600);
        color: #fff;
        box-shadow: 0 0 18px var(--purple-glow);
      }
      .btn-primary:hover {
        background: var(--purple-500);
        box-shadow: 0 0 28px var(--purple-glow);
        transform: translateY(-1px);
        color: #fff;
      }

      .btn-ghost {
        background: var(--bg-raised);
        color: var(--text-dim);
        border: 1px solid var(--border);
      }
      .btn-ghost:hover {
        color: var(--text);
        border-color: var(--purple-500);
      }

      .btn-outline {
        background: transparent;
        color: var(--purple-400);
        border: 1px solid var(--purple-600);
      }
      .btn-outline:hover {
        background: rgba(139,92,246,0.12);
        color: var(--purple-400);
      }

      .btn-danger {
        background: var(--danger);
        color: #fff;
      }
      .btn-danger:hover {
        background: #dc2626;
        color: #fff;
      }

      .btn-success {
        background: var(--success);
        color: #fff;
      }
      .btn-success:hover {
        background: #059669;
        color: #fff;
      }

      .btn-sm {
        padding: 6px 13px;
        font-size: .78rem;
      }

      /* ══════════════════════════════════
         BADGES
      ══════════════════════════════════ */
      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: 20px;
        padding: 3px 10px;
        font-size: .7rem;
        font-weight: 700;
        letter-spacing: .04em;
        white-space: nowrap;
      }

      .badge-purple {
        background: rgba(139,92,246,0.18);
        color: var(--purple-400);
        border: 1px solid rgba(139,92,246,0.35);
      }

      .badge-success {
        background: rgba(16,185,129,0.14);
        color: #34d399;
        border: 1px solid rgba(16,185,129,0.3);
      }

      .badge-muted {
        background: var(--bg-raised);
        color: var(--muted);
        border: 1px solid var(--border);
      }

      .badge-gold {
        background: rgba(245,158,11,0.14);
        color: var(--gold);
        border: 1px solid rgba(245,158,11,0.3);
      }

      /* ══════════════════════════════════
         PROGRESS BAR
      ══════════════════════════════════ */
      .progress-track {
        height: 8px;
        border-radius: 99px;
        background: var(--bg-raised);
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, var(--purple-600), var(--purple-400));
        box-shadow: 0 0 8px var(--purple-glow);
        transition: width 1s cubic-bezier(.4,0,.2,1);
      }

      /* ══════════════════════════════════
         FORM ELEMENTS
         Styles Django's form.as_p output
      ══════════════════════════════════ */
      input[type="text"],
      input[type="email"],
      input[type="password"] {
        width: 100%;
        background: var(--bg-raised);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        font-family: 'Space Grotesk', sans-serif;
        font-size: .9rem;
        padding: 11px 14px;
        outline: none;
        transition: border-color .2s, box-shadow .2s;
      }

      input[type="text"]:focus,
      input[type="email"]:focus,
      input[type="password"]:focus {
        border-color: var(--purple-500);
        box-shadow: 0 0 0 3px rgba(139,92,246,0.18);
      }

      label {
        display: block;
        font-size: .78rem;
        font-weight: 700;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: .07em;
        margin-bottom: 6px;
      }

      /* ══════════════════════════════════
         MAIN CONTAINER
      ══════════════════════════════════ */
      .site-main {
        max-width: 100%;
        margin: 0 auto;
        padding: 2rem 1.5rem 5rem;
        width: 100%;
      }

      /* ══════════════════════════════════
         BOTTOM NAV 
      ══════════════════════════════════ */
      .bottom-nav {
        display: flex;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        z-index: 200;
        background: rgba(13,17,23,0.96);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-top: 1px solid var(--border);
        padding: 6px 0 env(safe-area-inset-bottom, 6px);
      }

      .bottom-nav-inner {
        display: flex;
        justify-content: space-around;
        align-items: center;
      }

      .bn-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        color: var(--muted);
        font-size: .65rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .05em;
        text-decoration: none;
        padding: 8px 18px;
        border-radius: var(--radius-sm);
        transition: color .2s;
      }

      .bn-item svg {
        width: 20px;
        height: 20px;
        stroke-width: 2;
      }

      .bn-item.active,
      .bn-item:hover {
        color: var(--purple-400);
      }

      /* ══════════════════════════════════
         ANIMATIONS
      ══════════════════════════════════ */
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: none; }
      }

      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 0 4px rgba(139,92,246,0.18); }
        50%       { box-shadow: 0 0 0 9px rgba(139,92,246,0.05); }
      }

      .animate-in { animation: fadeUp .38s ease both; }

          /* ══════════════════════════════════
             LOADING STATES
          ══════════════════════════════════ */
          .loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
          }
          
          .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(139, 92, 246, 0.2);
            border-top: 4px solid var(--purple-500);
            border-radius: 50%;
            animation: spin 1s linear infinite;
          }
          
          @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
          
          .btn-loading {
            position: relative;
            color: transparent !important;
            pointer-events: none;
          }
          
          .btn-loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
          }

          /* ══════════════════════════════════
             RESPONSIVE
          ══════════════════════════════════ */
          @media (max-width: 640px) {
            .bottom-nav { display: block; }
            .site-main  { padding-bottom: 86px; }
            /* hide ghost nav links on mobile — bottom nav replaces them */
            .nav-actions .btn-ghost { display: none; }
          }

        </style>
        {% block head %}{% endblock %}
      </head>
  <body>

    <!-- ════════════ TOP NAV ════════════ -->
    <nav class="site-nav">
      <a class="nav-brand" href="{% url 'home' %}">
        <span class="nav-brand-badge">&lt;/&gt;</span>
        <span class="nav-brand-name">DevPath</span>
      </a>

      <div class="nav-actions">
        <a href="{% url 'build_hub' %}" class="nav-link" data-section="jobs">
                  <span class="nav-icon">💼</span>
                  <span class="nav-text">Jobs</span>
                </a>
        {% if user.is_authenticated %}
          <a class="btn btn-ghost btn-sm" href="{% url 'dashboard' %}">Dashboard</a>
          <a class="btn btn-ghost btn-sm" href="{% url 'roadmap' %}">Roadmap</a>
          <a class="btn btn-danger btn-sm" href="{% url 'logout' %}">Logout</a>
        {% else %}
          <a class="btn btn-ghost btn-sm" href="{% url 'login' %}">Login</a>
          <a class="btn btn-primary btn-sm" href="{% url 'register' %}">Sign Up</a>
        {% endif %}
      </div>
    </nav>

    <!-- ════════════ STATS BAR ════════════ -->
    {% if user.is_authenticated %}
    <div class="stats-bar">
      <div class="stat-chip">🪙 170 XP</div>
      <div class="stat-chip">🔑 2</div>
      <div class="stat-chip">🔥 0</div>
    </div>
    {% endif %}

    <!-- ════════════ MAIN CONTENT ════════════ -->
    <main class="site-main">
      {% block content %}{% endblock %}
    </main>

    <!-- ════════════ BOTTOM NAV (mobile) ════════════ -->
    <div class="bottom-nav">
      <div class="bottom-nav-inner">

        <a class="bn-item {% block bn_home %}{% endblock %}" href="{% url 'home' %}">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          Home
        </a>

        <a class="bn-item {% block bn_learn %}{% endblock %}" href="{% url 'roadmap' %}">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422A12.083 12.083 0 0112 21.5a12.083 12.083 0 01-6.16-10.922L12 14z"/>
          </svg>
          Learn
        </a>

        <a class="bn-item {% block bn_practice %}{% endblock %}" href="{% url 'practice_hub' %}">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
          Practice
        </a>

        <a class="bn-item {% block bn_jobs %}{% endblock %}" href="{% url 'build_hub' %}">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A9.002 9.002 0 0112 21a9.002 9.002 0 01-9-9.255M12 21V9m0 0l3 3m-3-3l-3 3"/>
          </svg>
          Jobs
        </a>

        <a class="bn-item {% block bn_board %}{% endblock %}" href="{% url 'leaderboard' %}">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
          </svg>
          Board
        </a>

        <a class="bn-item {% block bn_profile %}{% endblock %}" href="{% url 'dashboard' %}">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          Profile
        </a>

      </div>
    </div>

  </body>

  <script>
    // Loading states for forms and buttons
    document.addEventListener('DOMContentLoaded', function() {
      // Add loading state to all forms
      const forms = document.querySelectorAll('form');
      forms.forEach(form => {
        form.addEventListener('submit', function(e) {
          const submitBtn = form.querySelector('button[type="submit"]');
          if (submitBtn) {
            submitBtn.classList.add('btn-loading');
            submitBtn.disabled = true;
          }
        });
      });

      // Add loading state to logout links
      const logoutLinks = document.querySelectorAll('a[href*="logout"]');
      logoutLinks.forEach(link => {
        link.addEventListener('click', function(e) {
          this.classList.add('btn-loading');
          this.disabled = true;
        });
      });

      // Smooth scroll for anchor links
      const anchorLinks = document.querySelectorAll('a[href^="#"]');
      anchorLinks.forEach(link => {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          const target = document.querySelector(this.getAttribute('href'));
          if (target) {
            target.scrollIntoView({ behavior: 'smooth' });
          }
        });
      });

      // Add keyboard navigation support
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          // Close modals or reset forms
          const activeElement = document.activeElement;
          if (activeElement && activeElement.tagName === 'INPUT') {
            activeElement.blur();
          }
        }
      });

      // Auto-hide loading states after 10 seconds (fallback)
      setTimeout(() => {
        document.querySelectorAll('.btn-loading').forEach(btn => {
          btn.classList.remove('btn-loading');
          btn.disabled = false;
        });
      }, 10000);
    });
  </script>
</html>
